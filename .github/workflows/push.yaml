name: Push

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build-part1:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v6
            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
            - name: Build Part 1
              run: ./gradlew build
              working-directory: part1/implementation

    build-part2:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v6
            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
            - name: Build Part 2
              run: ./gradlew build
              working-directory: part2/implementation

